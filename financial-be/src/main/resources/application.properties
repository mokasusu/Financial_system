spring.application.name=financial-be

spring.config.import=optional:file:.env[.properties]

# Server
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:900000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
app.oauth2.redirect-uri=${APP_FRONTEND_URL:http://localhost:3000}/oauth2/callback

# SpringDoc OpenAPI & Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none

# File Upload Configuration
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# OCR API Configuration
app.ocr.base-url=${OCR_API_BASE_URL:http://localhost:8000}
app.ocr.api-key=${OCR_API_KEY:}
app.ocr.connect-timeout=${OCR_CONNECT_TIMEOUT_MS:10000}
app.ocr.response-timeout=${OCR_RESPONSE_TIMEOUT_SECONDS:600}
app.ocr.max-upload-mb=${OCR_MAX_UPLOAD_MB:25}

# Calculation Engine Configuration
app.calculation.default-scale=${CALCULATION_DEFAULT_SCALE:4}
app.calculation.rounding-mode=${CALCULATION_ROUNDING_MODE:HALF_UP}

# AI Analysis & OpenRouter Configuration
app.ai.openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
app.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
app.ai.openrouter.model=${OPENROUTER_MODEL:openrouter/free}
app.ai.openrouter.timeout=${OPENROUTER_TIMEOUT_SECONDS:120}


